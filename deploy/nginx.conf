# /etc/nginx/sites-available/sellix
# Replace sellix.software with your own domain, then:
#   sudo ln -s /etc/nginx/sites-available/sellix /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards; it rewrites this file to add the HTTPS block.

server {
    listen 80;
    listen [::]:80;
    server_name sellix.software www.sellix.software;

    root /var/www/sellix/web/dist;
    index index.html;

    client_max_body_size 2m;

    # The React app owns the routing, so unknown paths (/admin/leads, …) must
    # still return index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change content, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API and the site share one origin, so the session cookie works and
    # no CORS is involved.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
